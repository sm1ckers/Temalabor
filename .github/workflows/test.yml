name: .NET Tests

on:
  push:
    branches: [ "main" ]

permissions:
  issues: write
  contents: write
  checks: write   

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Kód letöltése
      uses: actions/checkout@v4
      
    - name: .NET beállítása
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Tesztek futtatása és riport generálása
      
      run: dotnet test Temalabor.Tests --logger "trx;LogFileName=test_results.trx"
      
    - name: Teszteredmények publikálása a GitHubon
      uses: dorny/test-reporter@v1
      if: success() || failure() 
      with:
        name: .NET Teszteredmények
        path: '**/test_results.trx'
        reporter: dotnet-trx

    - name: Issue készítése hiba esetén
      if: failure()
      uses: JasonEtco/create-an-issue@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}